name: Validate Marvel Guide
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install DOM test dependencies
        run: npm ci --ignore-scripts
      - name: Check embedded JSON, JavaScript, and character connections
        run: node scripts/validate-guide.mjs
      - name: Check PRO mode filters in catalog and chronology
        run: node --test scripts/tests/pro-mode.test.mjs
      - name: Check Agents of SHIELD seasons and timeline interleaving
        run: node --test scripts/tests/aos-timeline.test.mjs
      - name: Check artifact and material photo workflows
        run: node --test scripts/tests/photos.test.mjs
      - name: Check character photo gallery interactions
        run: node --test scripts/tests/photo-gallery.test.mjs
      - name: Check draft recovery, timeline and persistent image assignments
        run: node --test scripts/tests/admin-critical.test.mjs
      - name: Check encyclopedia coverage, categories, routes and image targets
        run: node --test scripts/tests/encyclopedia.test.mjs
      - name: Check text editing, search, all routes, blocks and spoilers
        run: node --test scripts/tests/interface-stage2.test.mjs
      - name: Check factual corrections and unified project and episode appearances
        run: node --test scripts/tests/facts-appearances.test.mjs
      - name: Check hybrid spoiler protection and static knowledge index
        run: node --test scripts/tests/spoiler-smart.test.mjs
      - name: Check generic episodes, WandaVision and legacy editing compatibility
        run: node --test scripts/tests/episodes.test.mjs
      - name: Check expanded MCU series and reciprocal episode appearances
        run: node --test scripts/tests/mcu-series.test.mjs
      - name: Check Loki, Agatha, Wakanda, Groot and What If episode metadata
        run: node --test scripts/tests/series-stage5.test.mjs
      - name: Check grouped series, multiple character groups and completed character cards
        run: node --test scripts/tests/character-series-groups.test.mjs
      - name: Check Groot identities, project items and reciprocal variant navigation
        run: node --test scripts/tests/groots-items-variants.test.mjs
      - name: Check cross-project Fox/Sony stingers and first appearances
        run: node --test scripts/tests/full-project-facts.test.mjs
      - name: Check concept-six homepage, editorial dates and admin editing
        run: node --test scripts/tests/homepage-v6.test.mjs
      - name: Check scroll choreography and reduced-motion accessibility
        run: node --test scripts/tests/homepage-motion.test.mjs
      - name: Check mobile navigation and search dropdown
        run: node --test scripts/tests/mobile-header-search.test.mjs
      - name: Check wider header, upcoming posters and random discovery
        run: node --test scripts/tests/homepage-polish.test.mjs
      - name: Check story periods, appearance versions, editions and upcoming project facts
        run: node --test scripts/tests/sitewide-editorial.test.mjs
      - name: Check story fields contain no production or editorial commentary
        run: node --test scripts/tests/editorial-cleanup.test.mjs
      - name: Check map side images and Nine Realms label layering
        run: node --test scripts/tests/maps-side-labels.test.mjs
      - name: Verify interactive map atlas, zoom and city drilldowns
        run: node --test scripts/tests/maps-atlas.test.mjs
      - name: Check main MCU places, source registry and map coordinates
        run: node --test scripts/tests/mcu-places-main.test.mjs
      - name: Check fast image loading and browser cache safety
        run: node --test scripts/tests/image-performance.test.mjs
