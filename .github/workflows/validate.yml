name: Validate Marvel Guide
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install DOM test dependencies
        run: npm ci --ignore-scripts
      - name: Check embedded JSON, JavaScript, and character connections
        run: node scripts/validate-guide.mjs
      - name: Check artifact and material photo workflows
        run: node --test scripts/tests/photos.test.mjs
      - name: Check draft recovery, timeline and persistent image assignments
        run: node --test scripts/tests/admin-critical.test.mjs
      - name: Check encyclopedia coverage, categories, routes and image targets
        run: node --test scripts/tests/encyclopedia.test.mjs
      - name: Check text editing, search, all routes, blocks and spoilers
        run: node --test scripts/tests/interface-stage2.test.mjs
      - name: Check factual corrections and unified project and episode appearances
        run: node --test scripts/tests/facts-appearances.test.mjs
      - name: Check generic episodes, WandaVision and legacy editing compatibility
        run: node --test scripts/tests/episodes.test.mjs
      - name: Check grouped series, multiple character groups and completed character cards
        run: node --test scripts/tests/character-series-groups.test.mjs
